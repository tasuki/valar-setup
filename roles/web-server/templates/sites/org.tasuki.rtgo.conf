{% extends "https-site.conf" %}

{% set server_name = "rtgo.tasuki.org" %}
{% set certificate_domain = "tasuki.org" %}

{% block site_settings %}
  <Files ".env">
    Require all denied
  </Files>

  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  ProxyPass / http://127.0.0.1:4760/
  ProxyPassReverse / http://127.0.0.1:4760/
{% endblock %}
