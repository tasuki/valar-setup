{% extends "https-site.conf" %}

{% set server_name = "tmp.tasuki.org" %}
{% set certificate_domain = "tasuki.org" %}

{% block site_settings %}
  <Directory /var/www/org.tasuki/tmp>
      Options FollowSymLinks Indexes
      AllowOverride All
      Order Allow,Deny
      Allow from all
  </Directory>
{% endblock %}
